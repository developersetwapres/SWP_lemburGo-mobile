name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze

      - name: Build Flutter Web
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          REVERSE_GEOCODING_URL: ${{ vars.REVERSE_GEOCODING_URL }}
        run: |
          set -euo pipefail

          if [[ -z "${API_BASE_URL:-}" ]]; then
            echo "Repository variable API_BASE_URL must be set to the public API base URL."
            exit 1
          fi

          build_args=(--release --base-href "/SWP_lemburGo-mobile/")
          build_args+=(--dart-define="API_BASE_URL=${API_BASE_URL}")

          if [[ -n "${REVERSE_GEOCODING_URL:-}" ]]; then
            build_args+=(--dart-define="REVERSE_GEOCODING_URL=${REVERSE_GEOCODING_URL}")
          fi

          flutter build web "${build_args[@]}"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
